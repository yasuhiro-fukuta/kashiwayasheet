# ============================================================
#  gas/ の内容を Apps Script プロジェクトへ反映する
# ============================================================
#  手でコピペする運用をやめるためのワークフロー。
#
#  必要なシークレット (Settings → Secrets and variables → Actions):
#    CLASPRC_JSON … ローカルで `clasp login` した後の
#                   ~/.clasprc.json の中身をそのまま貼る
#    SCRIPT_ID    … Apps Script エディタの
#                   ⚙ プロジェクトの設定 → スクリプトID
#
#  ★CLASPRC_JSON はリフレッシュトークンそのもの。
#    これを持つと Apps Script と Drive を操作できる。
#    リポジトリを公開する場合は特に取り扱いに注意すること。
# ============================================================
name: Deploy Apps Script

on:
  push:
    branches: [main]
    paths:
      - 'gas/**'
      - '.github/workflows/deploy-apps-script.yml'
  # 任意のブランチから手動で流したいとき用
  workflow_dispatch:

# 同じブランチで連続push したときに古い方を止める。
# 途中で打ち切られた push が後から上書きするのを防ぐ。
concurrency:
  group: deploy-apps-script
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # バージョンは固定する。clasp は v2 → v3 で認証まわりの仕様が
      # 変わっているため、latest だと突然壊れることがある。
      - name: clasp を入れる
        run: npm install -g @google/clasp@3.4.1

      # push は appsscript.json が無いと失敗する。
      # 先に分かりやすく落とす。
      - name: マニフェストの存在確認
        run: |
          if [ ! -f gas/appsscript.json ]; then
            echo "::error::gas/appsscript.json がありません。"
            echo "ローカルで一度 'clasp pull' して、生成された gas/appsscript.json を"
            echo "コミットしてください。手で作るとタイムゾーンや権限スコープが"
            echo "実際のプロジェクトとずれる恐れがあります。"
            exit 1
          fi
          echo "--- gas/appsscript.json ---"
          cat gas/appsscript.json

      - name: 認証情報を配置
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::error::シークレット CLASPRC_JSON が未設定です。"
            exit 1
          fi
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: プロジェクト設定を生成
        env:
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
        run: |
          if [ -z "$SCRIPT_ID" ]; then
            echo "::error::シークレット SCRIPT_ID が未設定です。"
            exit 1
          fi
          cat > .clasp.json <<JSON
          {
            "scriptId": "$SCRIPT_ID",
            "rootDir": "gas",
            "scriptExtensions": [".gs", ".js"],
            "htmlExtensions": [".html"],
            "jsonExtensions": [".json"]
          }
          JSON

      - name: 認証状態を確認
        run: clasp show-authorized-user || true

      # -f はマニフェスト差分の確認プロンプトを飛ばすため。
      # CI には対話できる相手がいないので必須。
      - name: Apps Script へ push
        run: clasp push -f

      - name: 後片付け
        if: always()
        run: rm -f "$HOME/.clasprc.json" .clasp.json
